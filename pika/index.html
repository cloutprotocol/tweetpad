<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tweetpad Agent: PIKA</title>
<link rel="icon" href="/assets/brand/tweetpad-hash-180.png">
<link rel="apple-touch-icon" href="/assets/brand/tweetpad-hash-180.png">
<meta name="theme-color" content="#6cc4ff">
<meta name="description" content="Meet Pika, a VRChat avatar living in a tweetpad agent: say hi and it talks back, lip-synced, in tall grass.">
<!-- posted on X, /pika plays in the post (?embed); its image is Pika with the title (?card, shot to assets/pika-card.png). Every URL must be absolute HTTPS. -->
<meta name="twitter:card" content="player">
<meta name="twitter:site" content="@tweetpad_io">
<meta name="twitter:title" content="Tweetpad Agent: PIKA">
<meta name="twitter:description" content="A VRChat avatar as a tweetpad agent. Say hi: it talks back, right in the post.">
<meta name="twitter:player" content="https://www.tweetpad.io/pika?embed">
<meta name="twitter:player:width" content="480">
<meta name="twitter:player:height" content="480">
<meta name="twitter:image" content="https://www.tweetpad.io/assets/pika-card.png?v=1">
<meta name="twitter:image:alt" content="Tweetpad Agent: PIKA, a yellow electric mouse avatar standing in tall grass under a blue sky">
<meta property="og:title" content="Tweetpad Agent: PIKA">
<meta property="og:description" content="A VRChat avatar as a tweetpad agent. Say hi: it talks back, right in the post.">
<meta property="og:image" content="https://www.tweetpad.io/assets/pika-card.png?v=1">
<meta property="og:url" content="https://www.tweetpad.io/pika">
<script>document.documentElement.dataset.mode = /[?&]card\b/.test(location.search) ? 'card' : /[?&]embed\b/.test(location.search) ? 'embed' : 'page';</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
  /* /pika: tweetpad's VRChat avatar example. A fan-made Pikachu avatar on the agent kit (/kit/v1/avatar.js) in the kit's meadow
     (/kit/v1/backdrop.js), with tweetpad's speech bubble and message box. Say something: it looks surprised, nods, answers through
     tweetpad's agent chat (Grok, as the built-in agent "pika") with lip-sync and a cheer or a shrug, and has its own lines when
     Grok can't answer. It follows the pointer and blinks. Same layout as /dot: X's card, a phone's tall player, and the full page. */
  :root { --ink: #10233a; --dim: #5d7183; --round: "Fredoka", "Varela Round", "Arial Rounded MT Bold", sans-serif; --ui: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d4f0ff; color: var(--ink); font: 15px/1.4 var(--ui); -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #avatar { touch-action: none; }
  #grass { pointer-events: none; }

  .home { position: fixed; top: 14px; left: 14px; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 99px;
          color: var(--ink); text-decoration: none; font: 600 16px/1 var(--round); background: rgba(255, 255, 255, .78); border: 1px solid rgba(16, 35, 58, .1); backdrop-filter: blur(10px); }
  .home img { width: 26px; height: 26px; }
  .home:hover, .home:focus-visible { border-color: #1da1f2; outline: none; }

  /* the speech bubble, just above its head */
  .bubble { position: fixed; left: 50%; top: 25%; z-index: 2; max-width: min(400px, 82vw); padding: 13px 18px; border-radius: 22px; color: #111;
            font: 500 19px/1.35 var(--round); background: #fff; box-shadow: 0 12px 36px rgba(16, 35, 58, .22); text-align: center;
            transform: translate(-50%, calc(-100% - 10px)) scale(var(--s, 1)); transform-origin: 50% 100%; transition: transform .25s cubic-bezier(.45, 0, .2, 1), opacity .25s; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 18px; height: 18px; margin-left: -9px; background: #fff; transform: rotate(45deg); border-radius: 3px; }
  .bubble.gone { opacity: 0; --s: .9; }
  .dots i { display: inline-block; width: 8px; height: 8px; margin: 0 3px; border-radius: 50%; background: #111; animation: hop 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 50% { transform: translateY(-5px); opacity: .5; } }

  /* the message box */
  form { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 3; width: min(560px, calc(100% - 32px)); transform: translateX(-50%);
         display: flex; gap: 8px; padding: 8px; border-radius: 22px; background: rgba(16, 24, 32, .72); border: 1px solid rgba(255, 255, 255, .12); backdrop-filter: blur(14px); }
  form input { flex: 1; min-width: 0; padding: 12px 14px; border: 0; border-radius: 14px; color: #f2f3f5; font: 16px/1.2 var(--ui); background: rgba(0, 0, 0, .3); outline: none; }
  form input::placeholder { color: #9aa3ad; }
  form button { padding: 0 20px; border: 0; border-radius: 14px; color: #111; font: 600 16px/1 var(--round); background: #fff; cursor: pointer; }
  form button:hover, form button:focus-visible { background: #fff6c4; outline: none; }
  form button:disabled { opacity: .5; cursor: default; }
  .log { position: fixed; left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 74px); z-index: 3; width: min(560px, calc(100% - 32px)); transform: translateX(-50%);
         display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; }
  .log span { max-width: 80%; padding: 8px 13px; border-radius: 16px 16px 4px 16px; color: #fff; background: #1da1f2; font: 15px/1.3 var(--ui); animation: rise .3s ease-out both; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .bubble, .log span, .dots i { transition: none; animation: none; } }

  /* X's card (480×480): tighter */
  html[data-mode="embed"] .home { top: 10px; left: 10px; padding: 4px 9px 4px 4px; font-size: 13px; }
  html[data-mode="embed"] .home img { width: 20px; height: 20px; }
  html[data-mode="embed"] .bubble { max-width: min(300px, 80vw); padding: 10px 14px; font-size: 15px; border-radius: 16px; }
  html[data-mode="embed"] form { bottom: max(16px, env(safe-area-inset-bottom)); width: calc(100% - 20px); padding: 6px; border-radius: 16px; }
  html[data-mode="embed"] form input { padding: 10px 12px; font-size: 15px; }
  html[data-mode="embed"] .log { bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px); width: calc(100% - 20px); }

  /* the share image (?card): the title over Pika, no controls */
  .title { display: none; }
  html[data-mode="card"] .title { display: flex; position: fixed; left: 0; right: 0; top: 7%; z-index: 3; flex-direction: column; align-items: center; gap: 14px; }
  html[data-mode="card"] .title b { font: 600 84px/1 var(--round); color: var(--ink); letter-spacing: -.01em; text-shadow: 0 4px 0 rgba(255, 255, 255, .7); }
  html[data-mode="card"] .title span { padding: 10px 22px; border-radius: 99px; background: #fff; font: 600 30px/1 var(--round); color: var(--ink); }
  html[data-mode="card"] .home { top: 3.4%; left: 50%; transform: translateX(-50%) scale(1.6); transform-origin: 50% 0; }
  html[data-mode="card"] form, html[data-mode="card"] .log, html[data-mode="card"] .bubble { display: none; }
  html[data-mode="card"] .title { top: 15%; }
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="room" aria-hidden="true"></canvas>
<canvas id="avatar" aria-label="Pika, a yellow electric mouse avatar standing in tall grass"></canvas>
<canvas id="grass" aria-hidden="true"></canvas>
<a class="home" href="/" title="Back to tweetpad"><img src="/assets/brand/tweetpad-hash-180.png" alt="">tweetpad</a>
<div class="title" aria-hidden="true"><b>Tweetpad Agent: PIKA</b><span>A VRChat avatar · say hi</span></div>
<div class="bubble gone" id="bubble" role="status" aria-live="polite"></div>
<div class="log" id="log" aria-hidden="true"></div>
<form id="say" autocomplete="off">
  <label for="msg" style="position:absolute;left:-9999px">Say something to Pika</label>
  <input id="msg" maxlength="140" placeholder="Say something to Pika…" enterkeyhint="send">
  <button type="button" id="send">Send</button>
</form>
<script type="module">
import { createAvatar } from '/kit/v1/avatar.js';
import { createBackdrop } from '/kit/v1/backdrop.js';

const mode = document.documentElement.dataset.mode;
const $ = (id) => document.getElementById(id);
createBackdrop($('room'), { theme: 'meadow', front: $('grass') });
const glb = await (await fetch('/pika/pika.glb')).arrayBuffer();
const avatar = await createAvatar($('avatar'), glb, { layout: mode === 'page' ? 'page' : 'embed', fit: mode === 'card' ? [0.42, 0.9] : undefined });

/* the bubble rides just above its head */
const bubble = $('bubble');
const place = () => { const at = avatar.head(); bubble.style.left = at.x * 100 + '%'; bubble.style.top = at.y * 100 + '%'; };
setInterval(place, 200); place();
function say(text) { bubble.textContent = text; bubble.classList.remove('gone'); avatar.speak(text); }
function thinking() { bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>'; bubble.classList.remove('gone'); }

/* its own lines, when Grok can't answer (out of credits, offline, or busy) */
const FALLBACK = ['Pika? Ask me again in a second!', 'Pika pika! My spark is low. Try again soon.', 'Pikachu! Say that one more time?'];
const history = [];
let busy = false;
async function talk(text) {
  busy = true; $('send').disabled = true;
  const mine = Object.assign(document.createElement('span'), { textContent: text });
  $('log').append(mine); setTimeout(() => mine.remove(), 6000);
  avatar.express('surprised', 1); avatar.act('nod'); thinking();
  history.push({ role: 'user', content: text });
  let reply = null;
  try {
    const r = await fetch('/api/agent-chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: 'pika', messages: history.slice(-8) }) });
    const out = await r.json().catch(() => ({}));
    reply = out.reply || (r.status === 429 && out.error) || null;
  } catch { /* offline */ }
  if (reply && history.at(-1).role === 'user') history.push({ role: 'assistant', content: reply });
  else history.pop();
  say(reply || FALLBACK[history.length % FALLBACK.length]);
  avatar.express('smile', 2.5); avatar.act(/[!?]/.test(reply || '') ? 'cheer' : 'shrug');
  busy = false; $('send').disabled = false;
}
/* no form submission: X's player frame is sandboxed without allow-forms, so a submit would be blocked; a click and Enter instead */
function send() {
  const text = $('msg').value.trim();
  if (!text || busy) return;
  $('msg').value = ''; talk(text.slice(0, 140));
}
$('send').addEventListener('click', send);
$('msg').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); send(); } });
$('say').addEventListener('submit', (e) => e.preventDefault());
if (mode !== 'card') setTimeout(() => { say('Pika! I live in this post now. Say hi!'); avatar.act('wave'); avatar.express('smile', 3); }, 1000);
</script>
</body>
</html>
