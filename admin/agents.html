<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agent review · tweetpad</title>
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
  /* /agents/review: tweetpad's own review of agents' code (api/agent-review.js). The admin key is asked for once and kept only while
     this page is open. Each version in the queue shows its safety check, runs in the same sandbox as the agent page (no model
     here: the bridge answers with stand-ins), shows its source, and is approved or sent back with a note. */
  :root { --ink: #f2f3f5; --dim: #8b9096; --line: rgba(255, 255, 255, .14); --glass: rgba(255, 255, 255, .06); --blue: #1da1f2; --ok: #3ccf6e; --warn: #f5c518; --bad: #ff6b6b;
          --round: "Fredoka", "Arial Rounded MT Bold", sans-serif; --ui: "Helvetica Neue", Helvetica, Arial, sans-serif; --mono: Menlo, Monaco, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0b0b0c; color: var(--ink); font: 14px/1.4 var(--ui); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  a { color: var(--blue); }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: rgba(11, 11, 12, .92); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
  header h1 { margin: 0; font: 600 20px/1 var(--round); } header img { width: 26px; height: 26px; }
  .tabs { display: flex; gap: 6px; margin-left: 12px; }
  .tabs button, .btn { padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); color: var(--ink); background: transparent; font: 600 14px/1 var(--round); cursor: pointer; }
  .tabs button[aria-selected=true] { background: #fff; color: #111; border-color: #fff; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #0b0b0c; } .btn.bad { border-color: var(--bad); color: var(--bad); } .btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .count { margin-left: 6px; padding: 2px 7px; border-radius: 99px; font-size: 12px; background: rgba(255, 255, 255, .15); }
  .tabs button[aria-selected=true] .count { background: #111; color: #fff; }
  .refresh { margin-left: auto; }
  main { padding: 20px; }
  .gate { max-width: 420px; margin: 12vh auto; padding: 24px; border-radius: 20px; background: #17181a; border: 1px solid var(--line); }
  .gate h2 { margin: 0 0 6px; font: 600 22px/1.2 var(--round); } .gate p { margin: 0 0 14px; color: var(--dim); }
  input, textarea { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: rgba(0, 0, 0, .35); font: 15px/1.3 var(--ui); outline: none; }
  input:focus, textarea:focus { border-color: var(--blue); }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .note { margin-top: 10px; font-size: 13px; color: var(--dim); } .note.bad { color: var(--bad); } .note.good { color: var(--ok); }
  /* the queue: a list on the left, the one open on the right */
  .split { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 20px; align-items: start; }
  .items { display: grid; gap: 10px; }
  .item { padding: 14px; border-radius: 16px; background: #17181a; border: 1px solid var(--line); cursor: pointer; }
  .item[aria-current=true] { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(29, 161, 242, .35); }
  .item h3 { margin: 0; display: flex; align-items: center; gap: 8px; font: 600 17px/1.2 var(--round); }
  .meta { margin-top: 4px; font-size: 12px; color: var(--dim); } .meta code { font: 12px var(--mono); color: #c9cdd2; }
  .verdict { margin-left: auto; padding: 3px 8px; border-radius: 99px; font: 700 11px/1 var(--ui); text-transform: uppercase; color: #0b0b0c; }
  .verdict.pass { background: var(--ok); } .verdict.review { background: var(--warn); } .verdict.block { background: var(--bad); }
  .reasons { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: #e8d38a; } .reasons.block { color: var(--bad); }
  .empty { padding: 40px; text-align: center; color: var(--dim); border: 1px dashed var(--line); border-radius: 16px; }
  .detail { position: sticky; top: 76px; padding: 16px; border-radius: 18px; background: #17181a; border: 1px solid var(--line); }
  .detail h2 { margin: 0; font: 600 22px/1.2 var(--round); }
  .stage-tabs { display: flex; gap: 6px; margin: 12px 0 10px; }
  .stage-tabs button { padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 13px/1 var(--round); cursor: pointer; }
  .stage-tabs button[aria-pressed=true] { background: #fff; color: #111; }
  .preview { position: relative; width: 480px; max-width: 100%; height: 480px; margin: 0 auto; overflow: hidden; border-radius: 14px; border: 1px solid var(--line); background: #0b0b0c; }
  .preview.full { width: 100%; height: 62vh; }
  .preview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .preview .bubble { position: absolute; left: 50%; top: 18%; z-index: 2; max-width: 70%; padding: 9px 12px; border-radius: 14px; color: #111; background: #fff; font: 500 14px/1.3 var(--round); transform: translateX(-50%); }
  .preview .bubble:empty { display: none; }
  .preview .box { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; height: 46px; border-radius: 14px; background: rgba(255, 255, 255, .1); border: 1px solid var(--line); }
  pre.source { max-height: 62vh; margin: 0; overflow: auto; padding: 14px; border-radius: 14px; background: #0f1011; border: 1px solid var(--line); font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: #c9cdd2; }
  .decide { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .decide textarea { min-height: 70px; resize: vertical; font-size: 14px; }
  /* every agent */
  table { width: 100%; border-collapse: collapse; background: #17181a; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; } th { color: var(--dim); font-weight: 600; }
  tr:last-child td { border-bottom: 0; } td code { font: 12px var(--mono); color: #c9cdd2; }
  .status { padding: 3px 8px; border-radius: 99px; font: 700 11px/1 var(--ui); text-transform: uppercase; }
  .status.live { background: var(--ok); color: #0b0b0c; } .status.review { background: #1d6ff2; color: #fff; } .status.construction { background: var(--warn); color: #111; }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } .detail { position: static; } }
</style>
</head>
<body>
<header>
  <img src="/assets/brand/tweetpad-hash-180.png" alt=""><h1>Agent review</h1>
  <div class="tabs" role="tablist" hidden id="tabs">
    <button type="button" role="tab" aria-selected="true" data-tab="queue">Queue<span class="count" id="n-queue">0</span></button>
    <button type="button" role="tab" aria-selected="false" data-tab="all">All agents<span class="count" id="n-all">0</span></button>
  </div>
  <button class="btn refresh" type="button" id="refresh" hidden>Refresh</button>
</header>
<main>
  <section class="gate" id="gate">
    <h2>Admin key</h2>
    <p>It stays in this tab only.</p>
    <input id="key" type="password" autocomplete="off" placeholder="admin key">
    <div class="row"><button class="btn blue" type="button" id="open">Open the queue</button></div>
    <div id="gate-note"></div>
  </section>
  <section id="queue" hidden><div class="split"><div class="items" id="items"></div><div class="detail" id="detail" hidden></div></div></section>
  <section id="all" hidden></section>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props || {}); e.append(...kids.flat().filter(k => k != null && k !== false)); return e; };
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
const kb = (n) => (n / 1024).toFixed(1) + ' KB';
let KEY = null;
try { KEY = sessionStorage.getItem('agentadmin'); } catch { /* blocked */ }
const api = async (path, body) => {
  const r = await fetch('/api/agent-review' + path, { method: body ? 'POST' : 'GET', headers: { 'x-admin': KEY, ...(body && { 'content-type': 'application/json' }) }, ...(body && { body: JSON.stringify(body) }) });
  if (path.includes('&v=')) { if (!r.ok) throw new Error('could not read the file (' + r.status + ')'); return r.text(); }
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.error || 'request failed (' + r.status + ')');
  return out;
};

/* the same sandbox as the agent page (a/agent.html): opaque origin, its policy first, no network */
const O = location.origin;
const CSP = ["default-src 'none'", "script-src 'unsafe-inline' 'unsafe-eval' blob: " + O + '/kit/ https://cdn.jsdelivr.net/npm/', "style-src 'unsafe-inline' " + O + '/kit/ https://fonts.googleapis.com',
  'font-src data: https://fonts.gstatic.com', 'img-src data: blob: ' + O + '/kit/ ' + O + '/assets/ https://cdn.jsdelivr.net/npm/', 'media-src data: blob:',
  'connect-src ' + O + '/kit/ https://cdn.jsdelivr.net/npm/', 'worker-src blob:', "frame-src 'none'", "form-action 'none'", "base-uri 'none'"].join('; ');
const sandboxed = (html) => '<!doctype html><meta http-equiv="Content-Security-Policy" content="' + CSP + '"><base href="' + O + '/">' + html.replace(/^\s*<!doctype[^>]*>/i, '');
function preview(box, html, name, layout) {
  box.replaceChildren();
  const bubble = el('div', { className: 'bubble' });
  const frame = el('iframe', { title: name + ' preview', srcdoc: sandboxed(html) });
  frame.setAttribute('sandbox', 'allow-scripts');
  frame.addEventListener('load', () => {
    const ch = new MessageChannel();
    /* the bridge, with stand-ins: no model, no credits spent, no browser */
    ch.port1.onmessage = ({ data: m }) => {
      const a0 = (m.args || [])[0];
      const answer = (result) => ch.port1.postMessage({ id: m.id, ok: true, result });
      /* the bubble as the agent page places it: pointing where tp.place says, kept inside the frame */
      const put = () => { if (!box.anchor) return; const w = bubble.offsetWidth, W = box.clientWidth;
        Object.assign(bubble.style, { left: Math.min(W - w / 2 - 8, Math.max(w / 2 + 8, box.anchor.x * W)) + 'px', top: 'auto', bottom: (1 - box.anchor.y) * box.clientHeight + 'px' }); };
      if (m.method === 'say') { bubble.textContent = String(a0 || '').slice(0, 280); put(); return answer(null); }
      if (m.method === 'place') { box.anchor = { x: Math.min(1, Math.max(0, +a0.x || 0)), y: Math.min(0.9, Math.max(0.12, +a0.y || 0)) }; put(); return answer(null); }
      if (m.method === 'ask') return answer({ reply: '(review preview: no model here)', credits: 0, offline: true });
      if (m.method === 'credits') return answer(250);
      return answer(null);
    };
    frame.contentWindow.postMessage({ type: 'tp:hello', agent: { name, display: name, look: {} }, layout }, '*', [ch.port2]);
    box.port = ch.port1;
  }, { once: true });
  box.append(frame, bubble, el('div', { className: 'box' }));
}

/* ---------- the queue ---------- */
let queue = [], open = null;
async function loadQueue() {
  queue = (await api('?queue')).queue;
  $('n-queue').textContent = queue.length;
  const items = $('items');
  if (!queue.length) { items.replaceChildren(el('div', { className: 'empty', textContent: 'Nothing waiting for review.' })); $('detail').hidden = true; return; }
  items.replaceChildren(...queue.map(q => {
    const c = q.check || { verdict: 'review', block: [], review: q.flags || [] };
    return el('div', { className: 'item', ariaCurrent: String(open === q.name), onclick: () => show(q) },
      el('h3', {}, q.name, el('span', { className: 'verdict ' + c.verdict, textContent: c.verdict })),
      el('div', { className: 'meta' }, '@' + q.handle + ' · ', el('code', { textContent: q.v.slice(0, 10) }), ' · ' + kb(q.size) + ' · sent ' + ago(q.at)),
      c.review.length ? el('ul', { className: 'reasons' }, c.review.map(r => el('li', { textContent: r }))) : null);
  }));
  const still = queue.find(q => q.name === open);
  if (still) show(still); else show(queue[0]);
}
async function show(q) {
  open = q.name;
  [...$('items').children].forEach((n, i) => n.setAttribute && n.setAttribute('aria-current', String(queue[i] && queue[i].name === q.name)));
  const d = $('detail'); d.hidden = false;
  const box = el('div', { className: 'preview' }), source = el('pre', { className: 'source', hidden: true });
  const status = el('div'), noteIn = el('textarea', { placeholder: 'A note for the owner (required to send it back)' });
  let html = '';
  const modes = [['embed', 'X card 480×480'], ['page', 'Full page'], ['source', 'Source']];
  const btns = modes.map(([k, label]) => el('button', { type: 'button', textContent: label, ariaPressed: String(k === 'embed'), onclick: () => mode(k) }));
  const mode = (k) => {
    btns.forEach((b, i) => b.setAttribute('aria-pressed', String(modes[i][0] === k)));
    source.hidden = k !== 'source'; box.hidden = k === 'source';
    if (k !== 'source') { box.classList.toggle('full', k === 'page'); preview(box, html, q.name, k); }
  };
  const decide = (decision) => async () => {
    if (decision === 'reject' && !noteIn.value.trim()) return status.replaceChildren(el('div', { className: 'note bad', textContent: 'Say what to change, for the owner.' }));
    status.replaceChildren(el('div', { className: 'note', textContent: decision === 'approve' ? 'Approving…' : 'Sending it back…' }));
    try {
      await api('', { name: q.name, v: q.v, decision, note: noteIn.value.trim() });
      status.replaceChildren(el('div', { className: 'note good', textContent: decision === 'approve' ? q.name + ' is live.' : 'Sent back to @' + q.handle + '.' }));
      open = null; setTimeout(refresh, 800);
    } catch (e) { status.replaceChildren(el('div', { className: 'note bad', textContent: e.message })); }
  };
  const c = q.check || { block: [], review: [], ai: null };
  d.replaceChildren(el('h2', {}, el('a', { href: '/a/' + q.name, target: '_blank', rel: 'noopener', textContent: q.name })),
    el('div', { className: 'meta' }, 'by @' + q.handle + ' · version ', el('code', { textContent: q.v }), ' · ' + kb(q.size) + ' · sent ' + ago(q.at)),
    c.ai ? el('div', { className: 'note', textContent: 'AI read: ' + c.ai.verdict + (c.ai.reasons.length ? ' (' + c.ai.reasons.join('; ') + ')' : '') }) : el('div', { className: 'note', textContent: 'AI read: not run (no model key).' }),
    el('div', { className: 'stage-tabs' }, btns), box, source,
    el('div', { className: 'decide' }, noteIn, el('div', { className: 'row' },
      el('button', { className: 'btn ok', type: 'button', textContent: 'Approve: make it live', onclick: decide('approve') }),
      el('button', { className: 'btn bad', type: 'button', textContent: 'Send back with the note', onclick: decide('reject') })), status));
  try { html = await api('?name=' + encodeURIComponent(q.name) + '&v=' + q.v); source.textContent = html; mode('embed'); }
  catch (e) { status.replaceChildren(el('div', { className: 'note bad', textContent: e.message })); }
}

/* ---------- every agent ---------- */
async function loadAll() {
  const { agents } = await api('?all');
  $('n-all').textContent = agents.length;
  const label = { live: 'Live', review: 'Under review', construction: 'Under construction' };
  $('all').replaceChildren(agents.length ? el('table', {},
    el('thead', {}, el('tr', {}, ['Agent', 'Owner', 'Status', 'Credits', 'Live code', 'In review', 'Browser', 'Claimed'].map(h => el('th', { textContent: h })))),
    el('tbody', {}, agents.map(a => el('tr', {},
      el('td', {}, el('a', { href: '/a/' + a.name, target: '_blank', rel: 'noopener', textContent: a.name }), a.state === 'paused' ? ' (paused)' : ''),
      el('td', { textContent: '@' + (a.handle || '') }),
      el('td', {}, el('span', { className: 'status ' + a.status, textContent: label[a.status] })),
      el('td', { textContent: a.credits.toLocaleString() }),
      el('td', {}, a.code ? el('code', { textContent: a.code.slice(0, 10) }) : '—'),
      el('td', {}, a.pending ? el('a', { href: '#', textContent: a.pending.v.slice(0, 10), onclick: (e) => { e.preventDefault(); tab('queue'); const q = queue.find(x => x.name === a.name); if (q) show(q); } }) : '—'),
      el('td', { textContent: a.browser ? 'on' : 'off' }),
      el('td', { textContent: a.createdAt ? new Date(a.createdAt).toISOString().slice(0, 10) : '—' }))))) : el('div', { className: 'empty', textContent: 'No agents yet.' }));
}

function tab(k) {
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === k)));
  $('queue').hidden = k !== 'queue'; $('all').hidden = k !== 'all';
}
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => tab(b.dataset.tab)));
async function refresh() { await Promise.all([loadQueue(), loadAll()]); }
$('refresh').addEventListener('click', refresh);

async function start() {
  try {
    await refresh();
    try { sessionStorage.setItem('agentadmin', KEY); } catch { /* blocked */ }
    $('gate').hidden = true; $('tabs').hidden = false; $('refresh').hidden = false; tab('queue');
  } catch (e) {
    KEY = null;
    $('gate').hidden = false;
    $('gate-note').replaceChildren(el('div', { className: 'note bad', textContent: /not allowed/.test(e.message) ? 'That isn’t the admin key.' : e.message }));
  }
}
$('open').addEventListener('click', () => { KEY = $('key').value.trim(); start(); });
$('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') { KEY = $('key').value.trim(); start(); } });
if (KEY) start(); else $('key').focus();
</script>
</body>
</html>
