<html lang="en">
<head>

<title>Tweetpad</title>

<!-- Every URL must be absolute HTTPS. -->
<meta name="twitter:card" content="player">
<meta name="twitter:site" content="@Prawnsfamily">

<meta name="twitter:description" content="Launch a pump.fun token without leaving the post.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&family=VT323&display=swap">
<style>
  body { margin: 0; min-height: 100vh; background: #0b1210; color: #f2f6f4; font: 18px/1.25 "VT323", ui-monospace, monospace;
         display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  .wrap { width: 100%; max-width: 480px; display: grid; gap: 12px; }
  h1 { margin: 0; font: 600 28px/1 "Pixelify Sans", monospace; }
  h1 span { color: #6fe7d8; }
  p { color: #a6bcbf; margin: 0; }
  a { color: #6fe7d8; }
  iframe { width: 100%; aspect-ratio: 1 / 1; border: 2px solid #071013; border-radius: 16px; display: block;
           box-shadow: 0 0 0 1px rgba(140, 200, 210, .25), 0 12px 40px rgba(0, 0, 0, .5); }
</style>
</head>
<body>
  <main class="wrap">
    <h1>Tweet<span>pad</span></h1>
    <p>Launch a pump.fun token without leaving the post. Paste this page's link into a tweet and the card below plays inside X.</p>
    <iframe src="embed.html" title="Tweetpad" allow="clipboard-write"></iframe>
    <p><a href="embed.html">Open full screen</a> · <a href="https://github.com/cloutprotocol/twitterpad">Source (MIT)</a></p>
  </main>
</body>
</html>
