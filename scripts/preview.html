<!doctype html>
<!-- Source for preview.png, the X card image. Render at 1080×1080 from the repo root:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1080,1080 \
       --virtual-time-budget=4000 --screenshot=preview.png scripts/preview.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>tweetpad preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap">
<style>
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
         font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;
         background: radial-gradient(90% 70% at 50% 35%, #f4f4f4, #dcdcdc); }
  /* the blue bar across the top, as in the app */
  body::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 92px;
                 background: linear-gradient(#63b8ee, #3c9ad9 50%, #2b86cc); border-bottom: 2px solid #1d6aa5;
                 box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35), 0 2px 8px rgba(0, 0, 0, .25); }
  /* and the dark tab bar along the bottom */
  body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 100px;
                background: linear-gradient(#3b3b3b, #1c1c1c 50%, #0c0c0c); border-top: 2px solid #000;
                box-shadow: inset 0 2px 0 rgba(255, 255, 255, .14); }
  .icon { position: relative; width: 220px; height: 220px; border-radius: 48px; overflow: hidden;
          background: linear-gradient(#63b8ee, #2b86cc);
          box-shadow: inset 0 3px 0 rgba(255, 255, 255, .5), 0 10px 24px rgba(0, 0, 0, .3), 0 2px 4px rgba(0, 0, 0, .25); }
  .icon img { position: absolute; inset: 30px; width: 160px; height: 160px; filter: brightness(0) invert(1) drop-shadow(0 -3px 0 rgba(0, 0, 0, .15)); }
  .icon::after { content: ""; position: absolute; left: -20%; right: -20%; top: -62%; height: 100%; border-radius: 50%;
                 background: linear-gradient(rgba(255, 255, 255, .5), rgba(255, 255, 255, .08)); }
  h1 { margin: 44px 0 0; font: 600 150px/1 "Fredoka", "Varela Round", "Arial Rounded MT Bold", sans-serif; letter-spacing: -.03em; color: #2f2f2f;
       text-shadow: 0 3px 0 #fff; }
  .card { margin-top: 46px; display: flex; align-items: center; gap: 26px; padding: 26px 36px 26px 26px; background: #fff;
          border: 2px solid #c8c8c8; border-radius: 12px; box-shadow: 0 3px 8px rgba(0, 0, 0, .12); }
  .card img { width: 84px; height: 84px; border-radius: 10px; object-fit: cover; box-shadow: 0 2px 4px rgba(0, 0, 0, .25); }
  .card b { display: block; font: bold 40px/1.15 "Helvetica Neue", Helvetica, Arial, sans-serif; color: #333; }
  .card span { display: block; margin-top: 4px; font: 32px/1.2 Georgia, serif; color: #777; }
  .card span em { font-style: normal; color: #0084b4; }
  .cta { margin-top: 44px; padding: 20px 44px; border-radius: 10px; color: #fff; font: bold 36px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
         text-shadow: 0 -2px 0 rgba(0, 0, 0, .25); background: linear-gradient(#33bcef, #019ad2); border: 2px solid #057ed0;
         box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35), 0 3px 6px rgba(0, 0, 0, .2); }
</style>
</head>
<body>
  <div class="icon"><img src="../assets/twitter-2012-bird.svg" alt=""></div>
  <h1>tweetpad</h1>
  <div class="card">
    <img src="../assets/agent-doge.jpg" alt="">
    <div><b>Launch from a post</b><span><em>pump.fun</em> · zero pad fee</span></div>
  </div>
  <div class="cta">▶ Expand the post to launch</div>
</body>
</html>
