<!doctype html>
<!-- Source for docs/brand/dex-banner-1500x500.png, the DexScreener banner: the app's 2012 header and launch card mid-typing,
     cropped by the banner's bottom edge, on a dotted light ground. Render from the repo root:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1500,500 \
       --virtual-time-budget=4000 --screenshot=docs/brand/dex-banner-1500x500.png scripts/dex-banner.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>tweetpad dex banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Inter:wght@400;600;700&display=swap">
<style>
  html, body { margin: 0; width: 1500px; height: 500px; overflow: hidden; }
  body { position: relative; font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;
         background: radial-gradient(circle, #d6dde3 1.4px, transparent 1.6px) 0 0 / 34px 34px, linear-gradient(#f7f9fa, #eef2f5); }
  /* the app window, cropped by the bottom edge */
  .app { position: absolute; left: 254px; top: 114px; width: 996px; height: 420px; border-radius: 14px 14px 0 0; overflow: hidden; background: #e6e6e6;
         box-shadow: 0 2px 6px rgba(20, 23, 26, .10), 0 24px 60px rgba(20, 23, 26, .14); }
  .bar { height: 96px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 16px;
         background: linear-gradient(#63b8ee, #3c9ad9 50%, #2b86cc); border-bottom: 2px solid #1d6aa5; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35); }
  .logo { display: flex; align-items: center; gap: 12px; flex: 1; }
  .logo img { width: 52px; height: 52px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .25)); }
  .logo b { font: 600 46px/1 Fredoka, sans-serif; letter-spacing: -.02em; color: #fff; text-shadow: 0 -2px 0 rgba(0, 0, 0, .25); }
  .tab { height: 66px; display: grid; place-items: center; padding: 0 22px; gap: 10px; grid-auto-flow: column; color: #fff; font: 700 26px/1 Inter, sans-serif;
         text-shadow: 0 -1px 0 rgba(0, 0, 0, .35); background: linear-gradient(#4aa6e4, #2c7fc4); border: 2px solid #1c5f98; border-radius: 10px;
         box-shadow: inset 0 2px 0 rgba(255, 255, 255, .3); }
  .tab.on { background: linear-gradient(#2a78b8, #2f86cb); border-color: #17558a; box-shadow: inset 0 2px 6px rgba(0, 0, 0, .35); }
  .tab svg { width: 30px; height: 30px; fill: #fff; filter: drop-shadow(0 -1px 0 rgba(0, 0, 0, .3)); }
  .tab.on svg { fill: #9fdcff; }
  .count { font: 700 22px/1 Inter, sans-serif; padding: 5px 12px; border-radius: 16px; background: rgba(0, 0, 0, .22); }
  .avatar { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(#ffd27a, #f5a623); }
  .caret { font-size: 18px; opacity: .9; }
  /* the launch card */
  .card { position: absolute; left: 142px; right: 142px; top: 96px; bottom: 0; background: #fff; border-left: 2px solid #c8c8c8; border-right: 2px solid #c8c8c8; }
  .head { height: 86px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; background: linear-gradient(#fafafa, #ededed);
          border-bottom: 2px solid #ddd; }
  .head span { font: 700 28px/1 Inter, sans-serif; color: #555; text-shadow: 0 2px 0 #fff; }
  .pair { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 12px; border: 2px solid #ccc; border-radius: 28px; background: linear-gradient(#fff, #f0f0f0); }
  .pair small { font: 24px/1 Inter, sans-serif; color: #999; }
  .pair .sol { width: 40px; height: 40px; border-radius: 50%; background: #000 url(../assets/solana.svg) center / 58% no-repeat; }
  .pair b { font: 700 26px/1 Inter, sans-serif; color: #333; }
  .body { display: flex; gap: 22px; padding: 20px 22px; }
  .img { width: 180px; height: 180px; flex: none; border-radius: 10px; object-fit: cover; box-shadow: 0 2px 4px rgba(0, 0, 0, .25); }
  .fields { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .field { height: 74px; display: flex; align-items: center; padding: 0 18px; font: 30px/1 Inter, sans-serif; color: #333; background: #fff;
           border: 2px solid #ccc; border-radius: 8px; box-shadow: inset 0 2px 4px rgba(0, 0, 0, .1); }
  .field.focus { border-color: #56b4ef; box-shadow: inset 0 2px 4px rgba(0, 0, 0, .1), 0 0 10px rgba(82, 168, 236, .6); }
  .field .cursor { width: 2px; height: 34px; margin-left: 2px; background: #333; }
  .pointer { position: absolute; left: 836px; top: 404px; width: 46px; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .3)); }
</style>
</head>
<body>
  <div class="app">
    <div class="bar">
      <div class="logo"><img src="../assets/brand/tweetpad-hash-256.png" alt=""><b>tweetpad</b></div>
      <div class="tab on"><svg viewBox="0 0 16 16"><path d="M8 .8c2.7 1.7 3.9 4.6 3.5 7.8l1.9 2.4v3l-2.9-1.5h-5L3.6 14v-3l1.9-2.4C5.1 5.4 6.3 2.5 8 .8zm0 4.1a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8zM6.6 13.2h2.8L8 15.6z" fill-rule="evenodd"/></svg></div>
      <div class="tab"><svg viewBox="0 0 16 16"><path d="M8 .5a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z" fill-rule="evenodd"/><path d="M7.3 3.6h1.4v1c.9.1 1.7.5 2.1 1.1l-1 .9c-.4-.4-.9-.7-1.6-.7-.6 0-1 .3-1 .7 0 .5.5.6 1.4.9 1.3.3 2.4.8 2.4 2.1 0 1-.8 1.8-2.3 2v1H7.3v-1c-1-.1-1.9-.6-2.4-1.3l1-.9c.5.5 1.1.9 1.9.9.7 0 1.1-.3 1.1-.7 0-.5-.5-.7-1.5-.9-1.2-.3-2.3-.7-2.3-2 0-.9.8-1.7 2.2-1.9z"/></svg><span class="count">13</span></div>
      <div class="tab"><svg viewBox="0 0 16 16"><path d="M6 1h2l-.6 3.5h3L11 1h2l-.6 3.5H15v2h-2.95l-.5 3H14v2h-2.8L10.6 15h-2l.6-3.5h-3L5.6 15h-2l.6-3.5H1v-2h3.55l.5-3H2v-2h3.4zm1.05 5.5-.5 3h3l.5-3z" fill-rule="evenodd"/></svg></div>
      <div class="tab">More</div>
      <div class="tab"><span class="avatar"></span><span class="caret">▾</span></div>
    </div>
    <div class="card">
      <div class="head"><span>Launch</span><div class="pair"><small>Pair</small><span class="sol"></span><b>SOL</b><small>▾</small></div></div>
      <div class="body">
        <img class="img" src="../assets/agent-inu.jpg" alt="">
        <div class="fields">
          <div class="field">Such Launch</div>
          <div class="field focus">WOW<span class="cursor"></span></div>
        </div>
      </div>
    </div>
  </div>
  <svg class="pointer" viewBox="0 0 24 36"><path d="M2 2v28l7-7 5 11 5-2-5-11h10z" fill="#fff" stroke="#14171a" stroke-width="2" stroke-linejoin="round"/></svg>
</body>
</html>
