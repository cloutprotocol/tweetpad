<!doctype html>
<!-- Source for docs/brand/tweetpad-token-*.png: the About screen's icon, made round for a token logo.
     Render 1024×1024 with a transparent background from the repo root:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1024,1024 \
       --default-background-color=00000000 --screenshot=docs/brand/tweetpad-token-1024.png scripts/token-logo.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>tweetpad token logo</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: transparent; }
  /* same blue, same gloss as .about-badge in skin-2012.css, scaled from 56px up to 1024px */
  .logo { position: relative; width: 1024px; height: 1024px; border-radius: 50%; overflow: hidden;
          background: linear-gradient(#63b8ee, #2b86cc); box-shadow: inset 0 18px 0 rgba(255, 255, 255, .5); }
  .logo img { position: absolute; left: 50%; top: 50%; width: 840px; height: 840px; transform: translate(-50%, -48%);
              filter: brightness(0) invert(1); }
  /* the glassy top half */
  .logo::after { content: ""; position: absolute; left: -20%; right: -20%; top: -60%; height: 100%; border-radius: 50%;
                 background: linear-gradient(rgba(255, 255, 255, .45), rgba(255, 255, 255, .1)); }
</style>
</head>
<body><div class="logo"><img src="../assets/twitter-2012-bird.svg" alt=""></div></body>
</html>
